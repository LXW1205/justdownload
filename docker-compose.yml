services:
  ytdl-term:
    build: .
    container_name: ytdl-term
    ports:
      - "3000:3000"
    environment:
      DOWNLOAD_DIR: /app/downloads
      COOKIES_PATH: /app/cookies.txt
    volumes:
      # Completed videos persist on the host. Open ./downloads in your file manager.
      - ./downloads:/app/downloads
      # Optional: drop a Netscape-format cookies.txt next to this file
      # to enable age-restricted / members-only downloads. Leave empty otherwise.
      - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped
